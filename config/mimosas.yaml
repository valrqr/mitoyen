comptes_approuves:
  exercice: 2025
  debut: 2025-01-01
  fin: 2025-12-31
  ag_approbation: 2026-05-20
  charges_courantes: 18650.40           # charges du budget prévisionnel
  charges_travaux_exceptionnelles: 0    # charges hors budget (travaux, opérations exceptionnelles)
  dettes_fournisseurs: 1240.00          # fournisseurs, rémunérations et autres, à la clôture
  impayes: 980.00                       # charges impayées par les copropriétaires, à la clôture
  nb_debiteurs_plus_300: 1              # copropriétaires débiteurs de plus de 300 €
  fonds_travaux: 5600.00                # montant du fonds de travaux à la clôture

# Vie de l'immeuble : les informations pratiques du pack nouvel arrivant. Ce ne sont
# pas des règles : en cas de doute, le règlement de copropriété fait foi. Ne jamais
# écrire ici un code d'accès (digicode, boîte à clés) : le pack peut circuler.
vie_immeuble:
  - { theme: "Ordures ménagères", texte: "Les bacs sont dans le local poubelles du rez-de-chaussée. Verre et cartons pliés dans les bacs de tri." }
  - { theme: "Encombrants", texte: "Rien dans les parties communes ni au sous-sol : la ville les enlève gratuitement sur rendez-vous." }
  - { theme: "Tranquillité", texte: "Travaux bruyants en semaine de 8h à 19h et le samedi de 9h à 18h. Le hall et l'escalier ne sont pas des lieux de stockage." }
  - { theme: "Vélos et poussettes", texte: "Un local vélos est au sous-sol, à côté des caves." }
  - { theme: "Jardin", texte: "Le jardin est commun à tous les résidents. Pas de barbecue." }
  - { theme: "En cas d'urgence", texte: "Panne d'ascenseur, fuite dans les parties communes : prévenir le syndic. Dans votre logement, appelez d'abord votre assureur (et votre bailleur si vous êtes locataire)." }

# Ce que dit le règlement de copropriété (à recopier du règlement, pas à deviner)
reglement:
  # Le règlement interdit-il toute activité commerciale dans les lots qui ne sont pas
  # spécifiquement à destination commerciale ? true | false | null (pas encore vérifié).
  # Condition pour pouvoir voter une interdiction des meublés de tourisme (loi 1965, art. 26).
  activite_commerciale_interdite: true
  # Position du règlement sur les meublés de tourisme : autorise | interdit | non_precise.
  # Les règlements établis depuis le 21/11/2024 doivent la préciser (loi 1965, art. 8-1-1).
  meubles_tourisme: non_precise

# Recouvrement des impayés (facultatif : valeurs par défaut ci-dessous)
recouvrement:
  seuil: 5                        # € : en dessous, pas de relance
  rappel_jours: 15                # rappel amiable, jours après l'échéance
  relance_jours: 30               # relance
  mise_en_demeure_jours: 45       # mise en demeure (loi 1965, art. 19-2)
  intervalle_min_jours: 15        # entre deux relances

# Fonds de travaux (art. 14-2 loi 1965) : cotisation annuelle au moins égale à
# 5 % du budget prévisionnel et, une fois un plan de travaux adopté en AG,
# à 2,5 % du montant des travaux prévus dans ce plan.
fonds_travaux:
  cle: generales
  cotisation_annuelle: 1200
  solde: { montant: 6800, au: 2026-12-31 }   # solde du compte du fonds à cette date

# Seuils votés en AG (montants TTC, en euros). Ils servent à aiguiller chaque
# dossier de travaux vers le bon circuit de décision.
seuils:
  consultation_conseil_syndical: 1500   # au-delà, le conseil syndical doit être consulté
  mise_en_concurrence: 3000             # au-delà, plusieurs devis sont obligatoires
  delegation_conseil_syndical:          # délégation de pouvoirs (art. 21-1 loi 1965)
    active: false                       # true si l'AG l'a votée
    plafond_par_depense: null           # montant maximum par dépense, fixé par l'AG

# -----------------------------------------------------------------------------
# 9. Appels de fonds
# -----------------------------------------------------------------------------
appels_de_fonds:
  periodicite: trimestrielle
  dates_exigibilite: ["01-01", "04-01", "07-01", "10-01"]   # MM-JJ
  envoi_jours_avant: 21                                      # avis envoyé 3 semaines avant
  compte_separe:                                             # compte bancaire du syndicat
    titulaire: "Syndicat des copropriétaires Résidence Les Mimosas"
    iban: "FR76 0000 0000 0000 0000 0000 000"                # fictif
    bic: "EXEMFRPPXXX"                                       # fictif
    ics: "FR00ZZZ000000"                                     # identifiant créancier SEPA, fictif (pour le prélèvement)
  reference_virement: "MIMOSAS-{exercice}-T{trimestre}-{coproprietaire}"

# -----------------------------------------------------------------------------
# 10. Diagnostics et obligations suivis par l'échéancier
# -----------------------------------------------------------------------------
diagnostics:
  - { id: pppt,  libelle: "Projet de plan pluriannuel de travaux", realise_le: 2026-10-01, validite_ans: 10 }
  - { id: dpe_collectif, libelle: "DPE collectif",                  realise_le: null,       validite_ans: 10 }
  - { id: dtg,   libelle: "Diagnostic technique global",            realise_le: null,       validite_ans: 10 }
  - { id: amiante, libelle: "Dossier technique amiante",            realise_le: 2019-05-14, validite_ans: null }

# -----------------------------------------------------------------------------
# 11. Plan pluriannuel de travaux (art. 14-2 loi 1965)
#     Reprend le projet établi par le professionnel (PPPT) : liste des travaux,
#     estimation sommaire du coût, priorité, année proposée sur 10 ans.
#     statut : projet (pas encore voté) | adopte (voté en AG, date dans adopte_le)
#     Montants TTC estimés aux prix de l'année d'élaboration.
#     categorie : securite | conservation | energie | confort
#     priorite  : 1 (indispensable) à 3 (souhaitable)
#     Le suivi (dossier ouvert, travaux réalisés) est tenu par Mitoyen dans data/,
#     cette section reste le plan tel qu'il a été présenté à l'AG.
# -----------------------------------------------------------------------------
plan_travaux:
  statut: projet
  elabore_le: 2026-10-01
  elabore_par: "Bureau d'études Exemple"        # fictif
  adopte_le: null
  annee_debut: 2027
  lignes:
    - { id: L01, intitule: "Remplacement de la porte de hall et du contrôle d'accès", categorie: securite,     priorite: 1, annee: 2027, montant: 3500,  cle: generales }
    - { id: L02, intitule: "Mise aux normes de l'ascenseur (portes palières)",        categorie: securite,     priorite: 1, annee: 2028, montant: 9000,  cle: ascenseur }
    - { id: L03, intitule: "Réfection de l'étanchéité de la toiture-terrasse",        categorie: conservation, priorite: 1, annee: 2029, montant: 28000, cle: generales }
    - { id: L04, intitule: "Ravalement des façades",                                  categorie: conservation, priorite: 2, annee: 2031, montant: 42000, cle: generales }
    - { id: L05, intitule: "Isolation du plancher bas (plafond du sous-sol)",         categorie: energie,      priorite: 2, annee: 2031, montant: 8000,  cle: generales }
    - { id: L06, intitule: "Remplacement des colonnes d'eau",                         categorie: conservation, priorite: 2, annee: 2033, montant: 18000, cle: generales }
    - { id: L07, intitule: "Éclairage LED et détecteurs des parties communes",        categorie: energie,      priorite: 3, annee: 2035, montant: 2500,  cle: generales }

